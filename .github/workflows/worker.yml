name: Discord Worker

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */5 * * *' 

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install discord.js-selfbot-v13 @upstash/redis

      - name: Run Worker
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_ID: ${{ secrets.BOT_ID }}
        run: node worker.js
